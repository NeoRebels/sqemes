<!-- SQEM-207 — Chrome in its own four colours.
     This was a monochrome Simple Icons glyph (one path, fill #4285F4). That is right for Brave,
     Opera and Vivaldi, whose real marks are single-colour — and wrong for the one browser the
     extension actually ships to: next to five correctly-coloured competitors, Chrome was the only
     icon that did not look like itself, so it read as broken.
     Geometric reconstruction: three 120° sectors (red top, yellow lower-right, green lower-left)
     with the white ring and blue centre. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Google Chrome">
  <path fill="#EA4335" d="M4.95 13A22 22 0 0 1 43.05 13Z"/>
  <path fill="#FBBC05" d="M43.05 13A22 22 0 0 1 24 46Z"/>
  <path fill="#34A853" d="M24 46A22 22 0 0 1 4.95 13Z"/>
  <circle cx="24" cy="24" r="10.5" fill="#fff"/>
  <circle cx="24" cy="24" r="8.5" fill="#4285F4"/>
</svg>
