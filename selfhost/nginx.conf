server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted assets, never cache the entrypoint.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SQEM-126 — runtime instance config is regenerated on restart; never cache it, so a
    # changed instance URL takes effect on the next load without a hard refresh.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SQEM-660 — Chat's data analysis. The APP fetches these runtime files (same origin, with the
    # person's cookies) and hands them to the analysis frame, which has no network of its own — so no
    # CORS here. Versioned path, so cached for good; `types` so the runtime arrives as WebAssembly.
    location /pyodide/ {
        types { application/javascript mjs js; application/wasm wasm; application/json json; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location = /analysis-sandbox.html {
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-AXFmyh3t1ra4PPVuDT1SNaDpriVkDRt5H5ChhT1Bz3M=' blob: 'wasm-unsafe-eval'; worker-src blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'self'";
        try_files $uri =404;
    }

    # SPA fallback — the app uses hash routing, but this keeps deep links / refreshes safe.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
